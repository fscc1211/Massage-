<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massage Reception Scheduler</title>
<style>
:root{--ink:#26343a;--muted:#718087;--line:#e4e9e8;--green:#477c70;--bg:#f4f7f5;--red:#b94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:26px 16px 48px}h1{font-size:clamp(25px,4vw,34px);margin:0 0 5px}.sub{color:var(--muted);margin:0 0 22px}
.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px;align-items:start}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 4px 18px #20352b08}
h2{font-size:18px;margin:0 0 14px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 6px}
input,select,button{font:inherit}input,select{width:100%;padding:10px 11px;border:1px solid #d6dfdd;border-radius:9px;background:#fff;color:var(--ink)}
button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--green);color:#fff;width:100%;margin-top:16px}
.secondary{background:#edf3f1;color:var(--green)}.danger{background:#fff0f0;color:var(--red);font-size:12px;padding:7px 10px}
.row{display:flex;align-items:center;gap:9px}.row input[type=checkbox]{width:auto;accent-color:var(--green)}.row label{margin:0;font-weight:550}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.message{font-size:13px;min-height:18px;margin-top:10px}.error{color:var(--red)}.success{color:var(--green)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.date{max-width:180px}
.staff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.staff-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.staff-head{padding:12px;background:#f6faf8;border-bottom:1px solid var(--line)}
.staff-name{font-size:17px;font-weight:800}.availability{font-size:12px;color:var(--green);margin-top:4px;line-height:1.45}
.booking-list{padding:8px 11px}.booking{padding:9px 0;border-bottom:1px solid #eef1f0;display:flex;justify-content:space-between;gap:8px;align-items:center}.booking:last-child{border:0}
.time{font-weight:750;font-variant-numeric:tabular-nums}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.empty{font-size:12px;color:#8b969a;padding:8px 0}
.staff-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:800px){.layout{grid-template-columns:1fr}.staff-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>Massage Reception</h1><p class="sub">ระบบจัดคิวพนักงานนวด M · P · C พร้อมเวลาพักและเวลาว่างถัดไป</p></header>
<div class="layout">
<section class="panel">
<h2>เพิ่มการจอง</h2>
<form id="bookingForm">
<label for="customer">ชื่อลูกค้า</label><input id="customer" required placeholder="ชื่อลูกค้า">
<label for="staff">พนักงานนวด</label><select id="staff"></select>
<label for="date">วันที่</label><input id="date" type="date" required>
<label for="start">เวลาเริ่มนวด</label><input id="start" type="time" required>
<label for="duration">ระยะเวลานวด</label>
<select id="duration">
<option value="15">15 นาที</option><option value="30">30 นาที</option><option value="45">45 นาที</option><option value="60" selected>60 นาที</option><option value="75">75 นาที</option><option value="90">90 นาที</option>
</select>
<div class="row" style="margin-top:15px"><input id="takeBreak" type="checkbox" checked><label for="takeBreak">ให้พนักงานพักหลังจบคิวนี้</label></div>
<div id="breakOptions"><label for="breakDuration">เวลาพัก</label><select id="breakDuration"><option value="5">5 นาที</option><option value="10" selected>10 นาที</option><option value="15">15 นาที</option></select></div>
<label for="service">ประเภทบริการ (ไม่บังคับ)</label><input id="service" placeholder="เช่น Thai massage, Oil massage">
<button class="primary" type="submit">บันทึกการจอง</button><div id="message" class="message" role="status"></div>
</form>
<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:15px">
<h2>ตั้งค่าชื่อพนักงาน</h2><div id="staffSettings"></div><button class="secondary" id="saveStaff" type="button">บันทึกชื่อ</button>
<p class="note">ชื่อเริ่มต้นคือ M, P และ C สามารถแก้ไขได้</p>
</div>
</section>
<section class="panel">
<div class="topline"><div><h2 style="margin:0 0 3px">ตารางคิวและเวลาว่าง</h2><div class="note">ระบบคำนวณเวลาที่แต่ละคนรับลูกค้าคนถัดไปได้ให้อัตโนมัติ</div></div><input class="date" id="viewDate" type="date" aria-label="เลือกวันที่"></div>
<div id="schedule" class="staff-grid"></div>
</section>
</div>
</main>
<script>
(()=>{
const KEY='massageReceptionData_v2';
const initial={staff:[{id:'M',name:'M'},{id:'P',name:'P'},{id:'C',name:'C'}],bookings:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch{data=initial}
const $=id=>document.getElementById(id);
const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
$('date').value=today;$('viewDate').value=today;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmt=n=>`${String(Math.floor(n/60)%24).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const finish=b=>mins(b.start)+Number(b.duration);
const availableAt=b=>finish(b)+(b.takeBreak?Number(b.breakDuration||0):0);
function showMessage(msg,error=false){$('message').textContent=msg;$('message').className='message '+(error?'error':'success')}
function renderStaff(){
$('staff').innerHTML=data.staff.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
$('staffSettings').innerHTML=data.staff.map(s=>`<div class="staff-edit"><input data-name="${esc(s.id)}" aria-label="ชื่อพนักงาน" value="${esc(s.name)}"><div class="note" style="align-self:center">พนักงาน ${esc(s.id)}</div></div>`).join('');
}
function render(){
const date=$('viewDate').value;
$('schedule').innerHTML=data.staff.map(s=>{
const list=data.bookings.filter(b=>b.date===date&&b.staffId===s.id).sort((a,b)=>a.start.localeCompare(b.start));
let next='ว่างทั้งวัน';
if(list.length){const last=list[list.length-1];next=`รับคิวถัดไปได้ ${fmt(availableAt(last))}`;}
const entries=list.length?list.map(b=>`<div class="booking"><div><div class="time">${esc(b.start)}–${fmt(finish(b))}</div><div class="meta">${esc(b.customer)} · ${b.duration} นาที${b.service?' · '+esc(b.service):''}</div><div class="meta">${b.takeBreak?'พัก '+b.breakDuration+' นาที · ว่าง '+fmt(availableAt(b)):'ไม่พักหลังคิวนี้'}</div></div><button class="danger" data-del="${esc(b.id)}" type="button">ลบ</button></div>`).join(''):'<div class="empty">ยังไม่มีคิวจอง</div>';
return `<article class="staff-card"><div class="staff-head"><div class="staff-name">${esc(s.name)}</div><div class="availability">${next}</div><div class="meta">${list.length} คิวในวันนี้</div></div><div class="booking-list">${entries}</div></article>`;
}).join('');
}
$('takeBreak').addEventListener('change',()=>{$('breakOptions').hidden=!$('takeBreak').checked});
$('staff').addEventListener('change',()=>{});
$('saveStaff').addEventListener('click',()=>{
data.staff.forEach(s=>{const el=document.querySelector(`[data-name="${s.id}"]`);if(el&&el.value.trim())s.name=el.value.trim()});
save();renderStaff();render();showMessage('บันทึกชื่อพนักงานแล้ว');
});
$('bookingForm').addEventListener('submit',e=>{
e.preventDefault();
const b={id:Date.now().toString()+Math.random().toString(16).slice(2),customer:$('customer').value.trim(),staffId:$('staff').value,date:$('date').value,start:$('start').value,duration:Number($('duration').value),takeBreak:$('takeBreak').checked,breakDuration:$('takeBreak').checked?Number($('breakDuration').value):0,service:$('service').value.trim()};
if(!b.customer||!b.date||!b.start){showMessage('กรุณากรอกข้อมูลให้ครบ',true);return}
const start=mins(b.start),end=start+b.duration;
if(end>1440){showMessage('เวลาจบเกินเที่ยงคืน กรุณาเลือกเวลาเริ่มใหม่',true);return}
const clash=data.bookings.some(old=>{
if(old.date!==b.date||old.staffId!==b.staffId)return false;
const oldStart=mins(old.start),oldAvailable=availableAt(old);
return start<oldAvailable&&oldStart<availableAt(b);
});
if(clash){showMessage('เวลานี้ชนกับคิวเดิมหรือเวลาพักของพนักงาน กรุณาเลือกเวลาอื่น',true);return}
data.bookings.push(b);save();$('viewDate').value=b.date;$('customer').value='';$('service').value='';render();showMessage('บันทึกการจองเรียบร้อยแล้ว');
});
$('schedule').addEventListener('click',e=>{
const btn=e.target.closest('[data-del]');if(!btn)return;
if(confirm('ต้องการลบคิวนี้ใช่ไหม?')){data.bookings=data.bookings.filter(b=>b.id!==btn.dataset.del);save();render()}
});
$('viewDate').addEventListener('change',render);
renderStaff();render();
})();
</script>
</body>
</html>
